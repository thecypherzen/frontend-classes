<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
  </head>
  <!--
Project Requirements:
1. Image Display
   - Practice image sizing
   - Create thumbnails
   - Handle image positioning
   - Work with image ratios

2. Gallery Layout
   - Create grid layout
   - Style image containers
   - Add hover effects
   - Practice image captions

3. Image Features
   - Add image filters
   - Create image overlays
   - Practice object-fit
   - Work with image shapes

Goals: Students should style these elements to create
an attractive and functional image gallery with various
display techniques.
-->
  <body>
    <header>
      <h1>Image Gallery</h1>
      <p>Exploring image styling and gallery layouts</p>
    </header>

    <main>
      <section>
        <h2>Basic Gallery</h2>
        <div>
          <figure>
            <img
              src="https://picsum.photos/300/200?random=1"
              alt="Sample image 1"
            />
            <figcaption>Image Caption 1</figcaption>
          </figure>
          <figure>
            <img
              src="https://picsum.photos/300/200?random=2"
              alt="Sample image 2"
            />
            <figcaption>Image Caption 2</figcaption>
          </figure>
          <figure>
            <img
              src="https://picsum.photos/300/200?random=3"
              alt="Sample image 3"
            />
            <figcaption>Image Caption 3</figcaption>
          </figure>
        </div>
      </section>

      <section>
        <h2>Thumbnail Grid</h2>
        <div>
          <img src="https://picsum.photos/150/150?random=4" alt="Thumbnail 1" />
          <img src="https://picsum.photos/150/150?random=5" alt="Thumbnail 2" />
          <img src="https://picsum.photos/150/150?random=6" alt="Thumbnail 3" />
          <img src="https://picsum.photos/150/150?random=7" alt="Thumbnail 4" />
        </div>
      </section>

      <section>
        <h2>Image Shapes</h2>
        <div>
          <img
            src="https://picsum.photos/200/200?random=8"
            alt="Circle image"
          />
          <img
            src="https://picsum.photos/200/200?random=9"
            alt="Square image"
          />
          <img
            src="https://picsum.photos/200/200?random=10"
            alt="Custom shape"
          />
        </div>
      </section>

      <section>
        <h2>Overlay Effects</h2>
        <div>
          <figure>
            <img
              src="https://picsum.photos/300/200?random=11"
              alt="Overlay image 1"
            />
            <figcaption>Hover for overlay effect</figcaption>
          </figure>
          <figure>
            <img
              src="https://picsum.photos/300/200?random=12"
              alt="Overlay image 2"
            />
            <figcaption>Different overlay style</figcaption>
          </figure>
        </div>
      </section>

      <section>
        <h2>Object-fit Examples</h2>
        <div>
          <img
            src="https://picsum.photos/400/300?random=13"
            alt="Cover example"
          />
          <img
            src="https://picsum.photos/400/300?random=14"
            alt="Contain example"
          />
          <img
            src="https://picsum.photos/400/300?random=15"
            alt="Fill example"
          />
        </div>
      </section>
    </main>
  </body>
</html>
