<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/contact.css" />

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const contactForm = document.getElementById("contact-form");
        if (!contactForm) {
          console.error("No form found");
        } else {
          contactForm.onsubmit = (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.setAttribute("disabled", true);
            setTimeout(() => {
              window.alert(`Form with Id: ${e.target?.id} Submitted`);
              submitBtn.removeAttribute("disabled");
              window.location.search = "/src/contact.html";
              window.location.reload();
            }, 3000);
          };
        }
      });
    </script>
  </head>
  <body>
    <!-- Top Section-->
    <header id="header" class="p-md flex items-center min-h-80">
      <div class="content-wrapper flex justify-between items-center">
        <section id="left-section" class="flex items-center gap-10">
          <div id="logo">
            <a href="../index.html" class="flex items-center gap-10">
              <div id="logo-icon"></div>
              <h4>William Inyam</h4>
            </a>
          </div>

          <div id="title">
            <h6>Full Stack Dev</h6>
          </div>
        </section>

        <nav id="navigation-menu">
          <menu class="flex items-center">
            <li><a href="resume.html">Resume</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
          </menu>
        </nav>
      </div>
    </header>

    <!-- Middle Section -->
    <div id="contact-main">
      <div class="content-wrapper py-3xl flex gap-50 justify-between">
        <!-- Left Section -->
        <div class="flex flex-col gap-20">
          <!-- Heading section -->
          <div class="flex flex-col gap-10 form-heading">
            <h1>Contact Me</h1>
            <p>Looking forward to hearing from you</p>
          </div>
          <!-- Details -->
          <div class="flex flex-col gap-20 contact-info">
            <p class="flex flex-col">
              <span class="bold">Phone</span>+234123456789
            </p>
            <p class="flex flex-col">
              <span class="bold">Email</span>myemail@myhost.tld
            </p>
          </div>
        </div>
        <!-- Right Section -->
        <div id="form-wrapper">
          <form action="#" id="contact-form">
            <!-- First name, Last Name Group -->
            <div class="form-control">
              <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" name="first-name" id="first-name" required />
              </div>
              <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" name="last-name" id="last-name" required />
              </div>
            </div>
            <!-- Email, Phone Number Group -->
            <div class="form-control">
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required />
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="" id="phone" required />
              </div>
            </div>
            <!-- Message Group -->
            <div class="form-group full-width">
              <label for="message">Message</label>
              <textarea name="message" id="message"></textarea>
            </div>
            <button id="submit-btn" type="submit" class="text-md bg-yellow">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Bottom Section -->
    <footer id="footer" class="h-200">
      <div class="content-wrapper flex justify-between items-center flex">
        <p class="flex flex-col gap-5">
          <span class="bold">Phone</span> <span>+234123456789</span>
        </p>
        <p class="flex flex-col gap-5">
          <span class="bold">Email</span> <span>myemail@myhost.tld</span>
        </p>
        <p class="flex flex-col gap-5">
          <span class="bold">Follow Me</span>
          <span class="flex gap-20">
            <span id="linkedin">
              <img
                src="../img/linkedin-logo.png"
                alt="ln"
                class="icon grayscale"
              />
            </span>
            <span id="twitter">
              <img
                src="../img/twitter-logo.png"
                alt="x"
                class="icon brightness-0"
              />
            </span>
          </span>
        </p>
        <p>&copy; 2035 | By William Inyam</p>
      </div>
    </footer>
  </body>
</html>
