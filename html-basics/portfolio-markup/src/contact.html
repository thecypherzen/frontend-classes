<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio | About</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Top Section-->
    <div id="header">
      <div id="left-section">
        <div id="logo">
          <a href="/index.html">
            <div id="logo-icon"></div>
            <h4>William</h4>
          </a>
        </div>

        <div id="title">
          <h6>Full Stack Dev</h6>
        </div>
      </div>

      <div id="navigation-menu">
        <menu>
          <li><a href="/src/resume.html">Resume</a></li>
          <li><a href="/src/projects.html">Projects</a></li>
          <li><a href="/src/contact.html">Contact</a></li>
        </menu>
      </div>
    </div>

    <!-- Middle Section -->
    <div id="main">
      <!-- Left Section -->
      <div>
        <!-- Heading section -->
        <div>
          <h1>Contact Me</h1>
          <p>Looking forward to hearing from you</p>
        </div>
        <!-- Details -->
        <div>
          <p><span>Phone</span>+234123456789</p>
          <p><span>Email</span>myemail@myhost.tld</p>
        </div>
      </div>
      <!-- Right Section -->
      <div>
        <form action="#">
          <!-- First name, Last Name Group -->
          <div>
            <div>
              <label for="first-name">First Name</label>
              <input type="text" name="first-name" id="first-name" />
            </div>
            <div>
              <label for="last-name">Last Name</label>
              <input type="text" name="last-name" id="last-name" />
            </div>
          </div>
          <!-- Email, Phone Number Group -->
          <div>
            <div>
              <label for="email">Email</label>
              <input type="email" name="email" id="email" />
            </div>
            <div>
              <label for="phone">Phone</label>
              <input type="number" name="" id="phone" />
            </div>
          </div>
          <!-- Message Group -->
          <div>
            <label for="message">Message</label>
            <textarea name="message" id="message"></textarea>
          </div>
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <!-- Bottom Section -->
    <div id="footer">
      <p><span>Phone</span> <span>+234123456789</span></p>
      <p><span>Email</span> <span>myemail@myhost.tld</span></p>
      <p>
        <span>Follow Me</span>
        <span>
          <span id="linkedin">
            <img
              src="/img/linkedin-logo.webp"
              alt="ln"
              style="width: 20px; height: auto"
            />
          </span>
          <span id="twitter">
            <img
              src="/img/twitter-logo.png"
              alt="x"
              style="width: 20px; height: auto"
            />
          </span>
        </span>
      </p>
      <p>&copy; 2035 | By William Inyam</p>
    </div>
  </body>
</html>
