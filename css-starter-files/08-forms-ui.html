<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms and UI Elements</title>
  </head>
  <!--
Project Requirements:
1. Form Layout
   - Style form structure
   - Create field grouping
   - Practice label alignment
   - Handle form spacing

2. Input Styling
   - Style text inputs
   - Create custom checkboxes
   - Style radio buttons
   - Format select dropdowns
   - Style textareas

3. Form States
   - Style focus states
   - Handle validation states
   - Create disabled styles
   - Add required field indicators

Goals: Students should style these elements to create
user-friendly and visually appealing form interfaces.
-->
  <body>
    <header>
      <h1>Forms and UI Elements</h1>
      <p>Styling form controls and user interface components</p>
    </header>

    <main>
      <section>
        <h2>Contact Form</h2>
        <form>
          <div>
            <label for="name">Full Name</label>
            <input type="text" id="name" required />
          </div>

          <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" required />
          </div>

          <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" />
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" rows="4"></textarea>
          </div>

          <fieldset>
            <legend>Preferences</legend>

            <div>
              <input type="checkbox" id="newsletter" />
              <label for="newsletter">Subscribe to newsletter</label>
            </div>

            <div>
              <input type="radio" name="contact" id="email-pref" />
              <label for="email-pref">Email</label>

              <input type="radio" name="contact" id="phone-pref" />
              <label for="phone-pref">Phone</label>
            </div>
          </fieldset>

          <div>
            <label for="subject">Subject</label>
            <select id="subject">
              <option value="">Select a subject</option>
              <option value="general">General Inquiry</option>
              <option value="support">Support</option>
              <option value="feedback">Feedback</option>
            </select>
          </div>

          <div>
            <label for="disabled-input">Disabled Input</label>
            <input
              type="text"
              id="disabled-input"
              disabled
              value="Cannot edit this"
            />
          </div>

          <div>
            <button type="submit">Submit Form</button>
            <button type="reset">Reset Form</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Search Interface</h2>
        <form>
          <div>
            <input type="search" placeholder="Search..." />
            <button type="submit">Search</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
