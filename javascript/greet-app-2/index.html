<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting App | 2</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
        padding: 0px;
        margin: 0px;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
      }

      .app-heading {
        display: flex;
        flex-direction: column;
        gap: 5px;
        justify-items: center;
        align-items: center;
        text-align: center;
        background-color: #c5c5c5;
        width: 100vw;
        padding: 24px;
      }
      .text-bold {
        font-weight: bold;
      }
      input {
        padding: 10px;
        outline: none;
        border: 1px solid #c5c5c5;
        border-radius: 5px;
        width: 90%;
        max-width: 600px;
      }
      #greeting-message-area {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 5px;
        justify-items: center;
        align-items: center;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app-heading">
      <h1>Greeting App</h1>
      <p>A simple greeting app</p>
    </div>

    <input type="text" placeholder="What is your name please?" />
    <div id="greeting-message-area"></div>
    <script src="app.js"></script>
  </body>
</html>
