<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizzard</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <!-- Header Section -->
      <header>
        <h1>Quizard</h1>
        <p>Test Your Brain Nerves</p>
      </header>
      <section id="result" class="hidden">
        <p id="score-wrapper">
          <span id="result-score"></span>
          <span id="percent-sign">%</span>
        </p>
        <p id="result-remark"></p>
      </section>
      <!-- Questions Section -->
      <section id="question-section">
        <div id="question-header">
          <p>Question <span id="question-summary"></span></p>
          <button>Quit</button>
        </div>
        <article>
          <h2 class="question">What is your name?</h2>
          <div id="question-options">
            <button>Option 1</button>
            <button>Option 2</button>
            <button>Option 3</button>
            <button>Option 4</button>
          </div>
        </article>
        <aside id="explanation" class="hidden">
          <div id="explanation-heading">
            <span>Explanation</span>
            <span id="explanation-toggle">show</span>
          </div>
          <p id="explanation-content" class="hidden"></p>
        </aside>
      </section>

      <!-- Navigation Section -->
      <footer>
        <nav>
          <button id="previous-btn">Previous</button>
          <button id="next-btn">Next</button>
        </nav>
        <button id="submit-btn">Submit</button>
      </footer>
    </main>
    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
